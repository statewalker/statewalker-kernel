<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A2UI surface prototype</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d2433; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-width: 1100px; }
      h1 { font-size: 16px; margin: 16px 16px 0; }
      .panel { background: #fff; border: 1px solid #dde1e7; border-radius: 8px; padding: 12px; }
      .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #5b6475; margin: 0 0 8px; }
      .a2ui-column { display: flex; flex-direction: column; gap: 8px; }
      .a2ui-row { display: flex; gap: 8px; }
      .confirm-card { border: 1px solid #c9d2e0; border-radius: 8px; padding: 12px; background: #fbfcfe; }
      .confirm-card h3 { margin: 0 0 4px; font-size: 15px; }
      .confirm-card p { margin: 0 0 10px; color: #4a5263; }
      button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #b7c0cf; background: #fff; cursor: pointer; }
      .confirm-card button { background: #c62828; color: #fff; border-color: #c62828; }
      .a2ui-refused { color: #a33; font-family: monospace; }
      .seg button[aria-pressed="true"] { background: #1d2433; color: #fff; border-color: #1d2433; }
      .log { font-family: ui-monospace, monospace; font-size: 12px; margin: 0; padding: 0; list-style: none; }
      .log li { padding: 3px 0; border-bottom: 1px dashed #e3e6eb; }
      .o-ran { color: #2e7d32; } .o-blocked, .o-denied, .o-invalid, .o-failed { color: #c62828; } .o-asking { color: #b26a00; }
      .ask { background: #fff7e6; border: 1px solid #f0c36d; border-radius: 6px; padding: 8px; margin-top: 8px; }
      .wide { grid-column: 1 / -1; }
      .code-editor { border: 1px solid #c9d2e0; border-radius: 6px; overflow: hidden; background: #fff; }
      .code-editor-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: #f3f4f6; font-size: 12px; color: #5b6475; }
      .code-editor-host .cm-editor { height: 160px; }
      .map-view { border: 1px solid #c9d2e0; border-radius: 6px; background: #eef3f8; }
      .map-marker-icon { background: none; border: none; }
      .map-marker { display: inline-block; transform: translate(-50%, -100%); white-space: nowrap; background: #1d2433; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; }
      pre { font-size: 12px; background: #f3f4f6; padding: 8px; border-radius: 6px; margin: 0; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>PROTOTYPE — A2UI 1.0 surface, thin React renderer, agent policy (statewalker-root#153)</h1>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
